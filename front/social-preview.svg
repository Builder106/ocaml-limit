<!--
Social-preview card. Rendered to PNG at the same path with:
    rsvg-convert -w 1200 -h 630 front/social-preview.svg -o front/social-preview.png
Or with ImageMagick:
    magick -background none -size 1200x630 front/social-preview.svg front/social-preview.png

Used by:
  - GitHub repo "Social preview" (Settings → General → upload PNG)
  - <meta property="og:image"> in front/index.html
  - <meta name="twitter:image"> in front/index.html

1200x630 is the canonical OG/Twitter/GitHub sweet-spot.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"
     font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <!-- Terminal-obsidian background. -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Faint grid lines for terminal texture. -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- Status-bar strip — matches the dashboard's header. -->
  <rect x="0" y="0" width="1200" height="44" fill="#000"/>
  <text x="40" y="29" fill="#00f0ff" font-size="14" font-weight="700" letter-spacing="0.05em">
    QUANT TERMINAL · OCAML LOB
  </text>
  <g transform="translate(1080, 18)">
    <circle cx="0" cy="6" r="5" fill="#00ff00"/>
    <text x="14" y="11" fill="#00ff00" font-size="14" font-weight="700">LIVE</text>
  </g>

  <!-- Logo: scaled favicon (red asks on top, green bids on bottom). -->
  <g transform="translate(80, 130) scale(4)">
    <rect x="0" y="3"  width="32" height="3" fill="#ff0000"/>
    <rect x="0" y="8"  width="26" height="3" fill="#ff0000"/>
    <rect x="0" y="13" width="18" height="3" fill="#ff0000"/>
    <rect x="0" y="18" width="22" height="3" fill="#00ff00"/>
    <rect x="0" y="23" width="28" height="3" fill="#00ff00"/>
    <rect x="0" y="28" width="14" height="3" fill="#00ff00"/>
  </g>

  <!-- Title block. -->
  <text x="290" y="180" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="-0.01em">
    OCaml LOB
  </text>
  <text x="290" y="225" fill="#9ca3af" font-size="22" font-weight="500">
    Limit-Order-Book Matching Engine in OCaml 5
  </text>

  <!-- Stats panel. -->
  <rect x="80" y="320" width="1040" height="180" fill="none"
        stroke="#1a1a1a" stroke-width="1"/>

  <!-- Stat column labels. -->
  <g fill="#6b7280" font-size="13" font-weight="600" letter-spacing="0.15em">
    <text x="155" y="368">THROUGHPUT</text>
    <text x="495" y="368">LATENCY · P99</text>
    <text x="855" y="368">PER-ORDER ALLOC</text>
  </g>

  <!-- Stat values. -->
  <g font-size="52" font-weight="700" letter-spacing="-0.02em">
    <text x="155" y="440" fill="#00ff00">~18 M</text>
    <text x="495" y="440" fill="#00f0ff">&lt; 1 μs</text>
    <text x="855" y="440" fill="#ffb000">0 B</text>
  </g>

  <!-- Stat units (smaller). -->
  <g font-size="16" fill="#6b7280" font-weight="500">
    <text x="155" y="468">orders / second</text>
    <text x="495" y="468">tail latency</text>
    <text x="855" y="468">bench-validated</text>
  </g>

  <!-- Footer URLs. -->
  <text x="80"   y="585" fill="#9ca3af" font-size="18" font-weight="500">
    github.com/Builder106/ocaml-limit
  </text>
  <text x="1120" y="585" text-anchor="end" fill="#9ca3af" font-size="18" font-weight="500">
    ocaml-lob.duckdns.org
  </text>
</svg>
