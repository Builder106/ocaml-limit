<!--
Light-mode README banner, paired with banner-dark.svg.

Distinct from front/social-preview.svg, which is locked at 1200x630
for the OG/Twitter/GitHub-repo-card sweet spot. The README banner
runs in a column that's much narrower than 1200px on most screens,
so a shorter aspect (1200x420 ~ 2.86:1) reads better.

The right half is the book itself: each price level drawn as its FIFO
queue of resting orders, oldest next to the price. Prices are integer
ticks written as OCaml literals, matching the README example
(~price:1_502_500 ~qty:100 is the first bid in the queue). The two
outlined asks are the oldest at the best price, filled by a market buy.

Render banner-light.png with headless Chromium: a 1200x420 window at
device scale factor 2, with a virtual time budget of a few seconds so
the IBM Plex web fonts load before the screenshot. XML comments cannot
contain a double hyphen, so the flags are not spelled out here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=block');
    .sans { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  </style>

  <rect width="1200" height="420" fill="#ffffff"/>

  <!-- Name and description. -->
  <text class="sans" x="64" y="150" fill="#1f2328" font-size="60" font-weight="600" letter-spacing="-0.02em">OCaml LOB</text>
  <g class="sans" fill="#31373d" font-size="21">
    <text x="66" y="198">A limit order book and matching engine</text>
    <text x="66" y="228">in OCaml 5. Orders match on price, then time.</text>
  </g>
  <text class="sans" x="66" y="276" fill="#59636e" font-size="16">About 18M orders/s, p99 under 1 µs, no allocation per submit.</text>
  <text class="mono" x="66" y="334" fill="#59636e" font-size="15">ocaml-lob.vercel.app</text>

  <!-- Price labels. -->
  <g class="mono" font-size="14" fill="#59636e" text-anchor="end">
    <text x="742" y="84">1_503_100</text>
    <text x="742" y="114">1_503_000</text>
    <text x="742" y="144">1_502_900</text>
    <text x="742" y="174" fill="#1f2328">1_502_800</text>
    <text x="742" y="234" fill="#1f2328">1_502_500</text>
    <text x="742" y="264">1_502_400</text>
    <text x="742" y="294">1_502_300</text>
    <text x="742" y="324">1_502_200</text>
  </g>

  <!-- Asks: resting sell orders, queued oldest first. -->
  <g fill="#cf222e">
    <rect x="760" y="70"  width="90"  height="18"/>
    <rect x="856" y="70"  width="140" height="18"/>
    <rect x="1002" y="70" width="60"  height="18"/>

    <rect x="760" y="100" width="120" height="18"/>
    <rect x="886" y="100" width="50"  height="18"/>
    <rect x="942" y="100" width="170" height="18"/>
    <rect x="1118" y="100" width="18" height="18"/>

    <rect x="760" y="130" width="70"  height="18"/>
    <rect x="836" y="130" width="110" height="18"/>

    <rect x="912" y="160" width="130" height="18"/>
    <rect x="1048" y="160" width="50" height="18"/>
  </g>
  <!-- Filled by the incoming buy: the two oldest at the best ask. -->
  <g fill="none" stroke="#cf222e" stroke-width="1.5">
    <rect x="760.75" y="160.75" width="58.5" height="16.5"/>
    <rect x="826.75" y="160.75" width="78.5" height="16.5"/>
  </g>

  <text class="mono" x="760" y="207" fill="#59636e" font-size="13">a market buy for 140 fills the two oldest asks</text>

  <!-- Bids: resting buy orders, queued oldest first. -->
  <g fill="#1a7f37">
    <rect x="760" y="220" width="100" height="18"/>
    <rect x="866" y="220" width="60"  height="18"/>
    <rect x="932" y="220" width="150" height="18"/>

    <rect x="760" y="250" width="80"  height="18"/>
    <rect x="846" y="250" width="130" height="18"/>
    <rect x="982" y="250" width="40"  height="18"/>
    <rect x="1028" y="250" width="90" height="18"/>

    <rect x="760" y="280" width="160" height="18"/>
    <rect x="926" y="280" width="70"  height="18"/>

    <rect x="760" y="310" width="50"  height="18"/>
    <rect x="816" y="310" width="120" height="18"/>
    <rect x="942" y="310" width="90"  height="18"/>
    <rect x="1038" y="310" width="60" height="18"/>
    <rect x="1104" y="310" width="32" height="18"/>
  </g>

  <text class="mono" x="760" y="360" fill="#59636e" font-size="13">each row is a queue, oldest order first</text>
</svg>
