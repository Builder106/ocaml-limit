<!--
Light-mode README banner — paired with banner-dark.svg.

Distinct from front/social-preview.svg, which is locked at 1200x630
for the OG/Twitter/GitHub-repo-card sweet spot. The README banner
runs in a column that's much narrower than 1200px on most screens,
so a shorter aspect (1200x420 ~ 2.86:1) reads better — it doesn't
swallow half the viewport on page load.

Color palette mirrors the dashboard's light theme (gray-800 text on
white, accents in *-600 weights to stay readable on a bright bg).

Render with:
    rsvg-convert -w 1200 -h 420 assets/banner-light.svg -o assets/banner-light.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"
     font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <!-- Paper-white background. -->
  <rect width="1200" height="420" fill="#ffffff"/>

  <!-- Faint grid lines. -->
  <g stroke="rgba(0,0,0,0.04)" stroke-width="1">
    <line x1="0" y1="70"  x2="1200" y2="70"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="355" x2="1200" y2="355"/>
  </g>

  <!-- Status-bar strip (light, gray-50). -->
  <rect x="0" y="0" width="1200" height="40" fill="#f4f4f5"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="27" fill="#0891b2" font-size="14" font-weight="700" letter-spacing="0.05em">
    QUANT TERMINAL | OCAML LOB
  </text>

  <!-- Logo: depth bars in the muted accents. -->
  <g transform="translate(80, 95) scale(3)">
    <rect x="0" y="3"  width="32" height="3" fill="#dc2626"/>
    <rect x="0" y="8"  width="26" height="3" fill="#dc2626"/>
    <rect x="0" y="13" width="18" height="3" fill="#dc2626"/>
    <rect x="0" y="16" width="22" height="3" fill="#16a34a"/>
    <rect x="0" y="23" width="28" height="3" fill="#16a34a"/>
    <rect x="0" y="28" width="14" height="3" fill="#16a34a"/>
  </g>

  <!-- Title block. -->
  <text x="220" y="160" fill="#1f2937" font-size="56" font-weight="700" letter-spacing="-0.01em">
    OCaml LOB
  </text>
  <text x="220" y="195" fill="#6b7280" font-size="19" font-weight="500">
    Limit-Order-Book Matching Engine in OCaml 5
  </text>

  <!-- Stats panel (light card background). -->
  <rect x="80" y="240" width="1040" height="110" fill="#fafafa"
        stroke="#e5e7eb" stroke-width="1"/>

  <!-- Stat column labels. -->
  <g fill="#9ca3af" font-size="12" font-weight="600" letter-spacing="0.15em">
    <text x="155" y="272">THROUGHPUT</text>
    <text x="495" y="272">LATENCY | P99</text>
    <text x="855" y="272">PER-ORDER ALLOC</text>
  </g>

  <!-- Stat values. -->
  <g font-size="40" font-weight="700" letter-spacing="-0.02em">
    <text x="155" y="320" fill="#16a34a">~18 M</text>
    <text x="495" y="320" fill="#0891b2">&lt; 1 μs</text>
    <text x="855" y="320" fill="#d97706">0 B</text>
  </g>

  <!-- Stat units. -->
  <g font-size="13" fill="#9ca3af" font-weight="500">
    <text x="155" y="340">orders / second</text>
    <text x="495" y="340">tail latency</text>
    <text x="855" y="340">bench-validated</text>
  </g>

  <!-- Footer URLs. -->
  <text x="80" y="390" fill="#6b7280" font-size="15" font-weight="500">
    github.com/Builder106/ocaml-limit
  </text>
  <text x="1120" y="390" text-anchor="end" fill="#6b7280" font-size="15" font-weight="500">
    ocaml-lob.duckdns.org
  </text>
</svg>
