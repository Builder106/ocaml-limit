<title id="figure-title">One test gate, two native images</title><desc id="figure-desc">Push to main starts dune build and dune runtest. Passing tests launch parallel native amd64 and arm64 image builds that push digests to GHCR. Both digests merge into latest and SHA multiarch manifest tags. The host then pulls the image and runs a smoke test. Failed tests stop publication.</desc>
