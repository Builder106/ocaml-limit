<style>
:root { color-scheme: light dark; --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --edge: #59636e; --box: #8c959f; --group: #d1d9e0; --groupfill: #f6f8fa; --accent: #0969da; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --ink: #f0f6fc; --muted: #9198a1; --edge: #9198a1; --box: #656c76; --group: #3d444d; --groupfill: #151b23; --accent: #4493f8; } }
html, body { margin: 0; background: var(--bg); }
main { max-width: 880px; margin: 0 auto; }
svg { display: block; width: 100%; height: auto; }
text { font-family: "IBM Plex Sans", system-ui, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.muted { fill: var(--muted); }
.accent-text { fill: var(--accent); }
.bg, .halo { fill: var(--bg); }
.node { fill: var(--bg); stroke-width: 1.25; }
.node.box { stroke: var(--box); }
.node.accent { stroke: var(--accent); stroke-width: 2; }
.group { fill: var(--groupfill); stroke: var(--group); }
.boundary { fill: none; stroke: var(--box); stroke-dasharray: 6 6; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.accent { stroke: var(--accent); stroke-width: 2; }
.edge.dashed { stroke-dasharray: 6 5; }
.lifeline { fill: none; stroke: var(--group); stroke-dasharray: 4 5; }
.tip { fill: var(--edge); }
.tip-accent { fill: var(--accent); }
</style>
</head>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 273" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">OCaml-Limit release pipeline</title>
<desc id="diagram-desc">A push to main runs dune build and dune runtest. If the tests fail, the workflow stops and publishes no image. If they pass, native amd64 and arm64 images build in parallel. A manifest job merges them into one image tagged latest and with the commit SHA, and the deploy job pulls latest and runs it on the host.</desc>

</defs>

<rect class="node box" x="716" y="64" width="148" height="67" rx="6"/>
<text x="730" y="91" font-size="16" font-weight="600">Deploy</text>
<text x="730" y="112" font-size="14" class="muted">pull and run</text>
<rect class="node box" x="16" y="190" width="190" height="67" rx="6"/>
<text x="30" y="217" font-size="16" font-weight="600">Stop</text>
<text x="30" y="238" font-size="14" class="muted">no image published</text>
<path class="edge" d="M206,97.5 L231,97.5 L231,49.5 L256,49.5" marker-end="url(#arrow)"/>
<path class="edge" d="M206,97.5 L231,97.5 L231,145.5 L256,145.5" marker-end="url(#arrow)"/>

<path class="edge" d="M456,145.5 L481,145.5 L481,97.5 L506,97.5" marker-end="url(#arrow)"/>
<path class="edge" d="M676,97.5 L716,97.5" marker-end="url(#arrow)"/>
<path class="edge dashed" d="M111,131 L111,190" marker-end="url(#arrow)"/>
<rect class="halo" x="115" y="152.5" width="47.2" height="19"/>
<text x="119" y="165.5" font-size="14" class="label">fails</text>
</svg>
