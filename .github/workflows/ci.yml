name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  format:
    name: Format check (ocamlformat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
          opam-pin: false

      - name: Install ocamlformat
        run: opam install --yes dune ocamlformat.0.27.0

      - name: Check formatting
        run: opam exec -- dune build @fmt

  check:
    name: Type check (dune build @check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
          opam-pin: false

      - name: Install deps
        run: opam install --yes dune alcotest

      - name: Type check
        run: opam exec -- dune build @check

  test:
    name: OCaml unit & perf regression tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
          opam-pin: false

      - name: Install test deps
        run: opam install --yes alcotest

      - name: Build (lib + tests + bench)
        run: opam exec -- dune build lib/ test/

      - name: Run tests
        run: opam exec -- dune runtest --force
