name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  format:
    name: Format check (ocamlformat) & opam lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5'
          opam-pin: false

      - name: Install ocamlformat
        run: opam install --yes dune ocamlformat.0.29.0

      - name: Check formatting (dune @fmt)
        run: opam exec -- dune build @fmt

      - name: Opam lint
        run: opam lint --strict ocaml_lob.opam

  check:
    name: Type check (dune build @check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5'
          opam-pin: false

      - name: Install deps
        run: opam install --yes dune alcotest

      - name: Type check
        run: opam exec -- dune build @check

  test:
    name: OCaml unit & perf regression tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5'
          opam-pin: false

      - name: Install test deps
        run: opam install --yes alcotest

      - name: Build (lib + tests + bench)
        run: opam exec -- dune build lib/ test/

      - name: Run tests
        run: opam exec -- dune runtest --force

  coverage:
    name: Unit coverage (lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5'
          opam-pin: false
      - name: Install coverage tools
        run: opam install --yes alcotest bisect_ppx
      - name: Build instrumented tests
        run: opam exec -- dune build --instrument-with bisect_ppx test/test_engine.exe test/test_internals.exe
      - name: Run instrumented tests
        run: |
          mkdir -p coverage
          BISECT_ENABLE=YES BISECT_FILE="$PWD/coverage/engine.coverage" opam exec -- dune exec --no-build test/test_engine.exe
          BISECT_ENABLE=YES BISECT_FILE="$PWD/coverage/internals.coverage" opam exec -- dune exec --no-build test/test_internals.exe
          opam exec -- bisect-ppx-report merge coverage/merged.coverage coverage/*.coverage
      - name: Enforce 100% deterministic library coverage
        run: |
          opam exec -- bisect-ppx-report summary --per-file coverage/merged.coverage
          opam exec -- bisect-ppx-report cobertura --ignore-missing-files coverage.xml coverage/merged.coverage
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          for cls in root.findall(".//class"):
              filename = cls.attrib.get("filename", "")
              if filename.startswith("lib/"):
                  rate = float(cls.attrib["line-rate"])
                  if rate < 1.0:
                      raise SystemExit(f"{filename}: {rate:.2%} line coverage")
          PY
